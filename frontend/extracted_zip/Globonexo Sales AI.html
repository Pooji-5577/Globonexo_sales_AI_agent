<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Globonexo — Sales AI Agent</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- load order matters: icons → shared → auth → onboarding → app → screens → tweaks → root -->
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="screens-a.jsx"></script>
<script type="text/babel" src="screens-b.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

/* ─── Tweaks defaults ─── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent":          "#00c27a",
  "auroraIntensity": 1,
  "radius":          "rounded",
  "agentName":       "Nexo"
}/*EDITMODE-END*/;

/* ─── All valid screens ─── */
const AUTH_SCREENS   = ['splash','login','signup','forgot'];
const ONB_SCREENS    = ['onboarding','celebrate'];
const APP_TABS       = ['dashboard','agent','prospects','pipeline','campaigns','inbox','meetings','analytics','billing','settings'];

/* ─── Jumper items ─── */
const JUMPER = [
  { id:'splash',      label:'🏠 Splash'            },
  { id:'signup',      label:'📝 Create account'    },
  { id:'login',       label:'🔑 Sign in'            },
  { id:'forgot',      label:'🔒 Forgot password'   },
  { id:'onboarding',  label:'🧭 Onboarding wizard' },
  { id:'celebrate',   label:'🎉 Agent ready!'      },
  { id:'dashboard',   label:'📊 Dashboard'         },
  { id:'agent',       label:'🤖 AI Agent'          },
  { id:'prospects',   label:'👥 Prospects'         },
  { id:'pipeline',    label:'🎯 Pipeline'          },
  { id:'campaigns',   label:'📤 Campaigns'         },
  { id:'inbox',       label:'📬 Inbox'             },
  { id:'meetings',    label:'📅 Meetings'          },
  { id:'analytics',   label:'📈 Analytics'         },
  { id:'billing',     label:'💳 Billing'           },
  { id:'settings',    label:'⚙️ Settings'          },
];

function Root() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  /* screen = auth/onb key OR an app tab */
  const [screen, setScreen] = useState(() => {
    const v = localStorage.getItem('gx_screen') || 'splash';
    /* migrate old 'app' value → dashboard */
    if (v === 'app') return 'dashboard';
    /* validate — if stored value is unknown, reset to splash */
    const all = [...AUTH_SCREENS, ...ONB_SCREENS, ...APP_TABS];
    return all.includes(v) ? v : 'splash';
  });

  useEffect(() => { localStorage.setItem('gx_screen', screen); }, [screen]);

  /* apply tweaks → CSS vars */
  window.__agentName = t.agentName || 'Nexo';
  useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty('--g-500', t.accent);
    r.setProperty('--primary', t.accent);
    r.setProperty('--aurora-opacity', String(t.auroraIntensity));
    const rad = t.radius === 'sharp' ? ['4px','6px','8px','12px']
              : t.radius === 'soft'  ? ['14px','18px','26px','34px']
              :                        ['10px','14px','20px','28px'];
    ['--r-sm','--r-md','--r-lg','--r-xl'].forEach((k,i) => r.setProperty(k, rad[i]));
  }, [t.accent, t.auroraIntensity, t.radius]);

  const go = (s) => setScreen(s);
  const isApp = APP_TABS.includes(screen);

  /* ── render ── */
  let view;
  if (screen === 'splash')      view = <Splash go={go} />;
  else if (screen === 'login')  view = <Login  go={go} />;
  else if (screen === 'signup') view = <Signup go={go} />;
  else if (screen === 'forgot') view = <Forgot go={go} />;
  else if (screen === 'onboarding') view = <OnboardingWizard go={go} />;
  else if (screen === 'celebrate')  view = <CelebrationScreen go={go} />;
  else if (isApp) {
    let page;
    if      (screen === 'dashboard')  page = <Dashboard setTab={go} />;
    else if (screen === 'agent')      page = <AgentWorkspace />;
    else if (screen === 'prospects')  page = <Prospects />;
    else if (screen === 'pipeline')   page = <Pipeline />;
    else if (screen === 'campaigns')  page = <Campaigns />;
    else if (screen === 'inbox')      page = <Inbox />;
    else if (screen === 'meetings')   page = <Meetings />;
    else if (screen === 'analytics')  page = <Analytics />;
    else if (screen === 'billing')    page = <Billing />;
    else if (screen === 'settings')   page = <Settings />;
    view = <AppShell tab={screen} setTab={go} go={go}>{page}</AppShell>;
  }

  return (
    <div className="stage">
      <div className="frame">
        {view}
      </div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand" />
        <TweakColor  label="Accent" value={t.accent}
          options={['#00c27a','#10b981','#06b6d4','#22c55e','#0ea5a4']}
          onChange={v => setTweak('accent', v)} />
        <TweakText   label="Agent name" value={t.agentName}
          onChange={v => setTweak('agentName', v)} />
        <TweakSection label="Style" />
        <TweakSlider label="Aurora glow" value={t.auroraIntensity} min={0} max={1} step={0.05}
          onChange={v => setTweak('auroraIntensity', v)} />
        <TweakRadio  label="Corners" value={t.radius}
          options={['sharp','rounded','soft']}
          onChange={v => setTweak('radius', v)} />
      </TweaksPanel>
    </div>
  );
}

/* ─── Screen jumper ─── */
function ScreenJumper({ current, go }) {
  const [open, setOpen] = useState(false);
  const groups = [
    { label: 'Pre-login',   items: JUMPER.slice(0, 4)  },
    { label: 'Onboarding',  items: JUMPER.slice(4, 6)  },
    { label: 'App screens', items: JUMPER.slice(6)     },
  ];
  return (
    <div style={{ position: 'absolute', right: 14, bottom: 14, zIndex: 50, fontFamily: 'var(--font-body)' }}>
      {open && (
        <div style={{ position: 'absolute', bottom: 56, right: 0, width: 230, background: '#fff', borderRadius: 18, boxShadow: 'var(--sh-lg)', border: '1px solid var(--line)', padding: '10px 8px', animation: 'pop .18s both', maxHeight: 480, overflowY: 'auto' }}>
          {groups.map(g => (
            <div key={g.label}>
              <div style={{ fontSize: 10.5, fontWeight: 800, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--faint)', padding: '8px 10px 4px' }}>{g.label}</div>
              {g.items.map(it => (
                <button key={it.id} onClick={() => { go(it.id); setOpen(false); }} style={{
                  display: 'block', width: '100%', textAlign: 'left', padding: '8px 10px', borderRadius: 10,
                  fontSize: 13.5, fontWeight: 700,
                  color: current === it.id ? 'var(--g-700)' : 'var(--ink-2)',
                  background: current === it.id ? 'var(--g-50)' : 'transparent',
                }}>{it.label}</button>
              ))}
            </div>
          ))}
        </div>
      )}
      <button onClick={() => setOpen(o => !o)} style={{
        height: 44, padding: '0 18px', borderRadius: 99, background: 'var(--ink)', color: '#fff',
        fontWeight: 800, fontSize: 13.5, boxShadow: 'var(--sh-lg)', display: 'flex', alignItems: 'center', gap: 9,
      }}>
        <Icon name="grid" size={16} color="#fff" /> Screens
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
